version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:15"
      timezone: "America/Cuiaba"
    open-pull-requests-limit: 5
    groups:
      python-security-and-runtime:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/maritime_ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "America/Cuiaba"
    open-pull-requests-limit: 5
    groups:
      maritime-ui-runtime:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:45"
      timezone: "America/Cuiaba"
    open-pull-requests-limit: 5
