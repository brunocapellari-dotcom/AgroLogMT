name: generate-maritime-lock-once

on:
  push:
    branches:
      - release/final-project-gate-v1
    paths:
      - .github/workflows/generate-maritime-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          ref: release/final-project-gate-v1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned
        with:
          node-version: "22"
      - name: Generate lock without lifecycle scripts
        working-directory: maritime_ui
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lock only
        shell: bash
        run: |
          set -euo pipefail
          test -s maritime_ui/package-lock.json
          git diff --exit-code -- maritime_ui/package.json
          git add maritime_ui/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ui): lock maritime dependencies [skip ci]'
          git push origin HEAD:release/final-project-gate-v1
