name: security-gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install security scanners
        run: python -m pip install "bandit>=1.8,<2" "pip-audit>=2.9,<3"
      - name: Secret and repository policy scan including reachable Git history
        run: python scripts/security_repo_scan.py
      - name: Python static security scan
        run: bandit -q -r gateway collector models scripts ckan_connector socrata_connector cftc_cot usda_agtransport -ll -ii
      - name: Audit Gateway dependencies
        run: pip-audit -r requirements-gateway.txt
      - name: Audit collector dependencies
        run: pip-audit -r requirements-collector.txt

  github-actions-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Audit GitHub Actions with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482
        with:
          inputs: .github/
          version: v1.30.1
          persona: auditor
          min-severity: medium
          min-confidence: medium
          advanced-security: false
          online-audits: true

  repository-trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Filesystem vulnerability and misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          cache: 'false'

  maritime-ui-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Resolve lockfile without lifecycle scripts
        working-directory: maritime_ui
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        working-directory: maritime_ui
        run: npm audit --omit=dev --audit-level=high
      - name: Build UI with lifecycle scripts disabled on install
        working-directory: maritime_ui
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build
