name: security-gate

on:
  pull_request:
    paths:
      - "gateway/**"
      - "collector/**"
      - "models/**"
      - "maritime_ui/**"
      - "scripts/**"
      - "requirements*.txt"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "SECURITY.md"
      - "docs/**SECURITY**"
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - "collector/**"
      - "models/**"
      - "maritime_ui/**"
      - "scripts/**"
      - "requirements*.txt"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
      - "SECURITY.md"
      - "docs/**SECURITY**"
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install security scanners
        run: python -m pip install "bandit>=1.8,<2" "pip-audit>=2.9,<3"
      - name: Secret and repository policy scan
        run: python scripts/security_repo_scan.py
      - name: Python static security scan
        run: bandit -q -r gateway collector models -ll -ii
      - name: Audit Gateway dependencies
        run: pip-audit -r requirements-gateway.txt
      - name: Audit collector dependencies
        run: pip-audit -r requirements-collector.txt

  maritime-ui-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Resolve lockfile without lifecycle scripts
        working-directory: maritime_ui
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        working-directory: maritime_ui
        run: npm audit --omit=dev --audit-level=high
      - name: Build UI with lifecycle scripts disabled on install
        working-directory: maritime_ui
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build
