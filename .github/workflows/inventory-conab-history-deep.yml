name: inventory-conab-history-deep-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "2010-2013"
            start: 2010
            end: 2013
          - label: "2014-2017"
            start: 2014
            end: 2017
          - label: "2018-2021"
            start: 2018
            end: 2021
          - label: "2022-2025"
            start: 2022
            end: 2025
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Scan official CONAB pages
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/inventory_conab_history.py \
            --start-year ${{ matrix.start }} \
            --end-year ${{ matrix.end }} \
            --allow-empty \
            --out conab_history_${{ matrix.label }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: conab-history-${{ matrix.label }}
          path: conab_history_${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 14

  registry:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: conab-history-*
          path: inventories
          merge-multiple: true
      - name: Merge vintages
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/merge_conab_inventories.py inventories/*.json --out conab_vintage_registry.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conab-vintage-registry
          path: conab_vintage_registry.json
          if-no-files-found: error
          retention-days: 30
