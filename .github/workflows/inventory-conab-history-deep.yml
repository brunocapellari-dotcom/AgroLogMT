name: inventory-conab-history-deep

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "collector/conab_safra_history.py"
      - "scripts/inventory_conab_history.py"
      - "scripts/merge_conab_inventories.py"
      - ".github/workflows/inventory-conab-history-deep.yml"

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "2010-2013"
            start: 2010
            end: 2013
          - label: "2014-2017"
            start: 2014
            end: 2017
          - label: "2018-2021"
            start: 2018
            end: 2021
          - label: "2022-2025"
            start: 2022
            end: 2025
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan official CONAB pages
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/inventory_conab_history.py \
            --start-year ${{ matrix.start }} \
            --end-year ${{ matrix.end }} \
            --allow-empty \
            --out conab_history_${{ matrix.label }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conab-history-${{ matrix.label }}
          path: conab_history_${{ matrix.label }}.json
          if-no-files-found: error
          retention-days: 14

  registry:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: conab-history-*
          path: inventories
          merge-multiple: true
      - name: Merge vintages
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/merge_conab_inventories.py inventories/*.json --out conab_vintage_registry.json
      - uses: actions/upload-artifact@v4
        with:
          name: conab-vintage-registry
          path: conab_vintage_registry.json
          if-no-files-found: error
          retention-days: 30
