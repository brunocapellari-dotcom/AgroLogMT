name: probe-conab-safra

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "collector/xlsx_reader.py"
      - "collector/conab_safra.py"
      - "collector/adapters.py"
      - "collector/config/sources.pilot.json"
      - "scripts/probe_conab_safra_live.py"
      - ".github/workflows/probe-conab-safra.yml"

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe latest official CONAB Safra XLSX
        env:
          PYTHONPATH: .
        run: python scripts/probe_conab_safra_live.py --out conab_safra_probe.json
      - name: Publish probe summary
        if: always()
        shell: bash
        run: |
          if [[ -f conab_safra_probe.json ]]; then
            {
              echo '### CONAB Safra live probe'
              echo '```json'
              cat conab_safra_probe.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload probe report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: conab-safra-probe
          path: conab_safra_probe.json
          if-no-files-found: ignore
          retention-days: 7
