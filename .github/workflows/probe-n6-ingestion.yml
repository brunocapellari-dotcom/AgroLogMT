name: probe-n6-ingestion-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install live-probe HTTP dependency
        run: python -m pip install --disable-pip-version-check "requests>=2.32,<3"
      - name: Probe CONAB historical, Comex Stat, NASA POWER and IBGE
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/probe_n6_ingestion_live.py --out n6_ingestion_probe.json
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: n6-ingestion-probe
          path: n6_ingestion_probe.json
          if-no-files-found: error
          retention-days: 7
