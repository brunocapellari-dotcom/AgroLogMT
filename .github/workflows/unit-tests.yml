name: unit-tests-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 pinned
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned
        with:
          python-version: "3.12"
      - name: Install connector runtime dependencies
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3" "websockets>=15,<16" "PyYAML>=6,<7" "pdfplumber>=0.11,<0.12"
      - name: Validate GitHub workflow YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          paths = sorted(Path('.github/workflows').glob('*.yml')) + sorted(Path('.github/workflows').glob('*.yaml'))
          if not paths:
              raise SystemExit('No GitHub workflow YAML files found')
          for path in paths:
              with path.open('r', encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print('OK', path)
          PY
      - name: Run unit tests and security gates
        run: python -m unittest discover -s tests -v
      - name: Run synthetic N6 promotion harness
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_n6_synthetic_backtest.py
      - name: Compile every Python file
        run: |
          python - <<'PY'
          import py_compile
          from pathlib import Path
          failures = []
          for path in sorted(Path('.').rglob('*.py')):
              if any(part in {'.git', '.venv', 'venv', 'node_modules', '__pycache__'} for part in path.parts):
                  continue
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append(f'{path}: {exc}')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
      - name: Validate every shell script
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find scripts -name '*.sh' -type f -print0)
      - name: Validate every JSON contract/config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('.').rglob('*.json')):
              if any(part in {'.git', 'node_modules', 'outputs'} for part in path.parts):
                  continue
              json.loads(path.read_text(encoding='utf-8'))
              print('OK', path)
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 pinned
        with:
          node-version: "22"
      - name: Build Maritime UI reproducibly
        working-directory: maritime_ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
