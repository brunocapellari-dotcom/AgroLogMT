name: unit-tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install connector runtime dependencies
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3" "websockets>=15,<16" "PyYAML>=6,<7" "pdfplumber>=0.11,<0.12"
      - name: Validate GitHub workflow YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = sorted(Path('.github/workflows').glob('*.yml')) + sorted(Path('.github/workflows').glob('*.yaml'))
          if not paths:
              raise SystemExit('No GitHub workflow YAML files found')
          for path in paths:
              with path.open('r', encoding='utf-8') as handle:
                  yaml.safe_load(handle)
              print('OK', path)
          PY
      - name: Run unit tests and security gates
        run: python -m unittest discover -s tests -v
      - name: Run synthetic N6 promotion harness
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_n6_synthetic_backtest.py
      - name: Compile N6, control-plane, connector, Comex and shipping Python modules
        run: >-
          python -m py_compile
          scripts/validate_conab_n6.py
          scripts/validate_gateway_n6.py
          scripts/validate_comexstat_bigquery.py
          scripts/run_n6_synthetic_backtest.py
          scripts/inspect_n6_bigquery_readiness.py
          scripts/probe_news_signal_writer.py
          models/point_in_time.py
          models/readiness.py
          models/restore_readiness.py
          models/baselines.py
          models/feature_matrix.py
          models/training_dataset.py
          models/evaluation.py
          models/promotion.py
          models/shipping_reconciliation.py
          models/shipping_pipeline.py
          models/port_geofence.py
          gateway/maritime_queries.py
          collector/source_registry.py
          collector/registry_scheduler.py
          collector/source_promotion.py
          collector/input_security.py
          collector/cloud_runner.py
          collector/orchestrator.py
          collector/comexstat_pipeline.py
          collector/ais_stream.py
          collector/ais_stream_client.py
          collector/ais_worker.py
          collector/lineup_normalizer.py
          collector/official_lineup_html.py
          collector/official_lineup_pdf.py
          collector/shipping_lineup_worker.py
          collector/shipping_bigquery.py
          collector/shipping_reconcile_worker.py
          collector/port_lifecycle.py
          ckan_connector/client.py
          ckan_connector/portals.py
          socrata_connector/client.py
          cftc_cot/client.py
          cftc_cot/datasets.py
          usda_agtransport/client.py
          usda_agtransport/datasets.py
      - name: Validate shell syntax
        run: bash -n scripts/preflight_n6_gcp.sh scripts/deploy_collectors_gcloud.sh scripts/deploy_gateway_gcloud.sh scripts/homologate_n6_core.sh scripts/homologate_comex_gcp.sh scripts/setup_github_gcp_wif.sh scripts/setup_aisstream_secret.sh scripts/deploy_ais_worker_gcloud.sh scripts/harden_github_repository.sh
      - name: Validate JSON contracts/config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = [
              'collector/config/sources.pilot.json',
              'collector/config/sources.p0.json',
              'collector/config/maritime_lineup_sources.v1.json',
              'collector/config/data_source_registry.v1.json',
              'contracts/canonical_record_metadata.schema.json',
              'contracts/comexstat.v1.json',
              'contracts/product_trade_codes.v1.json',
              'contracts/imea_agro.v1.json',
              'contracts/climate_hydrology.v1.json',
              'contracts/news_signal.v0_5.schema.json',
              'contracts/soy_mt_datamart.v1.json',
              'contracts/shipping_reconciliation.v1.json',
              'contracts/maritime_geofences.v1.json',
              'contracts/data_source_registry.v1.schema.json',
              'contracts/source_promotion_gate.v1.schema.json',
              'contracts/restore_drill.v1.schema.json',
              'contracts/ai_roles.v1.json',
              'contracts/global_supply_demand.v1.schema.json',
              'contracts/forecast_vintage.v1.schema.json',
              'models/registry.json',
              'models/feature_contracts.json',
          ]
          for path in files:
              json.loads(Path(path).read_text(encoding='utf-8'))
              print('OK', path)
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build Maritime UI
        working-directory: maritime_ui
        run: |
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          npm run build
