name: unit-tests

on:
  pull_request:
    paths:
      - "collector/**"
      - "gateway/**"
      - "models/**"
      - "tests/**"
      - "contracts/**"
      - "scripts/**"
      - "sql/**"
      - "ckan_connector/**"
      - "socrata_connector/**"
      - "cftc_cot/**"
      - "usda_agtransport/**"
      - "docs/N6_*.md"
      - "docs/M01_*.md"
      - "requirements*.txt"
      - ".github/workflows/unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install connector runtime dependencies
        run: python -m pip install "requests>=2.31,<3"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic N6 promotion harness
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_n6_synthetic_backtest.py
      - name: Compile N6, connector and shipping Python modules
        run: python -m py_compile scripts/validate_conab_n6.py scripts/validate_gateway_n6.py scripts/run_n6_synthetic_backtest.py scripts/inspect_n6_bigquery_readiness.py scripts/probe_news_signal_writer.py models/point_in_time.py models/readiness.py models/baselines.py models/feature_matrix.py models/training_dataset.py models/evaluation.py models/promotion.py models/shipping_reconciliation.py models/shipping_pipeline.py models/port_geofence.py collector/ais_stream.py collector/lineup_normalizer.py collector/shipping_bigquery.py ckan_connector/client.py ckan_connector/portals.py socrata_connector/client.py cftc_cot/client.py cftc_cot/datasets.py usda_agtransport/client.py usda_agtransport/datasets.py
      - name: Validate shell syntax
        run: bash -n scripts/preflight_n6_gcp.sh scripts/deploy_collectors_gcloud.sh scripts/deploy_gateway_gcloud.sh scripts/homologate_n6_core.sh scripts/setup_github_gcp_wif.sh
      - name: Validate JSON contracts/config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = [
              'collector/config/sources.pilot.json',
              'contracts/canonical_record_metadata.schema.json',
              'contracts/comexstat.v1.json',
              'contracts/imea_agro.v1.json',
              'contracts/climate_hydrology.v1.json',
              'contracts/news_signal.v0_5.schema.json',
              'contracts/soy_mt_datamart.v1.json',
              'contracts/shipping_reconciliation.v1.json',
              'models/registry.json',
              'models/feature_contracts.json',
          ]
          for path in files:
              json.loads(Path(path).read_text(encoding='utf-8'))
              print('OK', path)
          PY
