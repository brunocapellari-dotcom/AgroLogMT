name: unit-tests

on:
  pull_request:
    paths:
      - "collector/**"
      - "gateway/**"
      - "models/**"
      - "tests/**"
      - "contracts/**"
      - "requirements*.txt"
      - ".github/workflows/unit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standard-library unit tests
        run: python -m unittest discover -s tests -v
