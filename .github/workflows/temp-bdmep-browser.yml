name: TEMP BDMEP browser download

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temp-bdmep-browser.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest
          npx playwright install --with-deps chromium
      - name: Download second BDMEP in Chromium
        shell: bash
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const source=fs.readFileSync('.github/workflows/temp-bdmep-range.yml','utf8');
            const urls=[...source.matchAll(/https:\/\/bdmep\.inmet\.gov\.br\/[A-Za-z0-9$._-]+\.zip/g)].map(x=>x[0]);
            if(urls.length<2) throw new Error('second BDMEP URL not found');
            const url=urls[1];
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({acceptDownloads:true, locale:'pt-BR'});
            const page=await context.newPage();
            await page.goto('https://bdmep.inmet.gov.br/', {waitUntil:'domcontentloaded', timeout:60000});
            console.log('root opened');
            const downloadPromise=page.waitForEvent('download',{timeout:240000});
            try { await page.goto(url,{waitUntil:'commit',timeout:240000}); } catch(e) { console.log('goto ended',e.message); }
            const download=await downloadPromise;
            await download.saveAs('BDMEP_INMET_segundo.zip');
            console.log('saved bytes',fs.statSync('BDMEP_INMET_segundo.zip').size);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          unzip -t BDMEP_INMET_segundo.zip
      - name: Upload BDMEP ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bdmep-second-browser
          path: BDMEP_INMET_segundo.zip
          compression-level: 0
          retention-days: 1
