name: probe-climate-grid-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Probe IBGE boundary and NASA POWER spatial grid
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/probe_climate_grid_live.py --spacing 0.75 --sample-points 3 --out climate_grid_probe.json
      - name: Upload climate-grid probe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: climate-grid-probe
          path: climate_grid_probe.json
          if-no-files-found: error
          retention-days: 7
