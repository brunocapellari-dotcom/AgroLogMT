name: probe-climate-grid

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "collector/ibge_malhas.py"
      - "collector/climate_grid.py"
      - "collector/nasa_power.py"
      - "scripts/probe_climate_grid_live.py"
      - "tests/test_climate_grid.py"
      - ".github/workflows/probe-climate-grid.yml"

permissions:
  contents: read

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe IBGE boundary and NASA POWER spatial grid
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/probe_climate_grid_live.py --spacing 0.75 --sample-points 3 --out climate_grid_probe.json
      - name: Upload climate-grid probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: climate-grid-probe
          path: climate_grid_probe.json
          if-no-files-found: error
          retention-days: 7
