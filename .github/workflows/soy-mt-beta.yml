name: soy-mt-beta

on:
  # ZERO_COST: legacy beta remains manual. Recurring Actions are not part of
  # the canonical local runtime and must not consume hosted-runner quota.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Probe live CONAB storage layout
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/probe_conab_storage_layout.py
      - name: Generate live Soja MT Beta V0.2 snapshot
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/run_soy_mt_beta.py \
            --climate-sample-points 7 \
            --out-json soy_mt_beta.json \
            --out-md soy_mt_beta.md
      - name: Publish beta summary
        if: always()
        run: |
          echo "# Soja MT Beta V0.2" >> "$GITHUB_STEP_SUMMARY"
          if [ -f soy_mt_beta.md ]; then
            cat soy_mt_beta.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Snapshot markdown was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload beta snapshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soy-mt-beta-${{ github.run_id }}
          path: |
            soy_mt_beta.json
            soy_mt_beta.md
          if-no-files-found: error
          retention-days: 7
