name: soy-mt-beta

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * *"
    - cron: "15 19 * * *"
  pull_request:
    paths:
      - "scripts/generate_soy_mt_beta.py"
      - "scripts/generate_soy_mt_beta_v02.py"
      - "scripts/probe_conab_storage_layout.py"
      - "tests/test_soy_mt_beta.py"
      - "tests/test_soy_mt_beta_v02.py"
      - "models/agroclimate.py"
      - ".github/workflows/soy-mt-beta.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe live CONAB storage layout
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/probe_conab_storage_layout.py
      - name: Generate live Soja MT Beta V0.2 snapshot
        env:
          PYTHONPATH: ${{ github.workspace }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          SAMPLE_POINTS=7
          if [ "$EVENT_NAME" = "pull_request" ]; then SAMPLE_POINTS=3; fi
          python scripts/generate_soy_mt_beta_v02.py \
            --climate-sample-points "$SAMPLE_POINTS" \
            --out-json soy_mt_beta.json \
            --out-md soy_mt_beta.md
      - name: Upload beta snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soy-mt-beta-${{ github.run_id }}
          path: |
            soy_mt_beta.json
            soy_mt_beta.md
          if-no-files-found: error
          retention-days: 30
