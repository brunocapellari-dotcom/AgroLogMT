name: comex-export30-hurdle-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hurdle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest tests.test_comex_soy_export30_hurdle -v
      - name: Build live MT soybean export hurdle
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/build_comex_soy_export30_hurdle.py --start-year 2015 --out comex_soy_export30_hurdle.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comex-soy-export30-hurdle-${{ github.run_id }}
          path: comex_soy_export30_hurdle.json
          retention-days: 30
