name: inventory-conab-history-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build read-only CONAB historical inventory
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/inventory_conab_history.py --start-year 2018 --end-year 2025 --out conab_history_inventory.json
      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conab-history-inventory
          path: conab_history_inventory.json
          if-no-files-found: error
          retention-days: 7
