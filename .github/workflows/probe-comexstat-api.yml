name: probe-comexstat-api-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comexstat-live-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest tests.test_comexstat_api tests.test_comexstat_api_adapter -v
      - name: Live API multi-product and cities canaries
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -o pipefail
          python scripts/probe_comex_api_live.py | tee comex_api_live_report.json
