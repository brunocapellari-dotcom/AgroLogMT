name: probe-comexstat-api

on:
  pull_request:
    paths:
      - "collector/comexstat_api.py"
      - "tests/test_comexstat_api.py"
      - ".github/workflows/probe-comexstat-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest tests.test_comexstat_api -v
      - name: Live metadata and soybean query
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from collector.comexstat_api import ComexStatApiClient, soybean_export_payload

          client = ComexStatApiClient(timeout=120)
          update = client.last_update()
          years = client.available_years()
          print(json.dumps({"update": update.__dict__, "years": years}, ensure_ascii=False))
          assert years[0] <= 1997 and years[1] >= 2026
          assert update.year == 2026 and update.month is not None

          period = f"{update.year:04d}-{update.month:02d}"
          result = client.general(soybean_export_payload(start=period, end=period))
          data = result.get("data")
          assert data is not None
          if isinstance(data, dict):
              rows = data.get("list") or data.get("data") or []
          else:
              rows = data
          print(json.dumps({"period": period, "row_count": len(rows) if isinstance(rows, list) else None, "sample": rows[:3] if isinstance(rows, list) else str(type(rows))}, ensure_ascii=False))
          assert isinstance(rows, list)
          assert rows, "consulta soja ComexStat retornou zero linhas"
          PY
