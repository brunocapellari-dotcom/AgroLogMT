name: probe-comexstat-api

on:
  pull_request:
    paths:
      - "collector/comexstat_api.py"
      - "collector/adapters.py"
      - "collector/config/sources.p0.json"
      - "scripts/probe_comex_api_live.py"
      - "tests/test_comexstat_api.py"
      - "tests/test_comexstat_api_adapter.py"
      - ".github/workflows/probe-comexstat-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest tests.test_comexstat_api tests.test_comexstat_api_adapter -v
      - name: Live API metadata, filter semantics and Mato Grosso soybean canaries
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/probe_comex_api_live.py | tee comex_api_live_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comex-api-live-report-${{ github.run_id }}
          path: comex_api_live_report.json
          if-no-files-found: warn
          retention-days: 14
