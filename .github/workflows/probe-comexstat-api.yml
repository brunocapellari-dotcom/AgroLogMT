name: probe-comexstat-api-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comexstat-live-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest tests.test_comexstat_api tests.test_comexstat_api_adapter -v
      - name: Live API multi-product and cities canaries
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -o pipefail
          python scripts/probe_comex_api_live.py | tee comex_api_live_report.json
