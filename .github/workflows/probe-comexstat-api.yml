name: probe-comexstat-api

on:
  pull_request:
    paths:
      - "collector/comexstat_api.py"
      - "collector/adapters.py"
      - "collector/config/sources.p0.json"
      - "tests/test_comexstat_api.py"
      - "tests/test_comexstat_api_adapter.py"
      - ".github/workflows/probe-comexstat-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest tests.test_comexstat_api tests.test_comexstat_api_adapter -v
      - name: Live metadata and Mato Grosso soybean query
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from collector.comexstat_api import ComexStatApiClient, soybean_export_payload

          client = ComexStatApiClient(timeout=120)
          update = client.last_update()
          years = client.available_years()
          print(json.dumps({"update": update.__dict__, "competence": update.competence, "years": years}, ensure_ascii=False))
          assert years[0] <= 1997 and years[1] >= 2026
          assert update.competence is not None

          result = client.general(
              soybean_export_payload(
                  start=update.competence,
                  end=update.competence,
                  state_code=51,
                  include_logistics=True,
              )
          )
          rows = client.data_list(result)
          print(json.dumps({"period": update.competence, "scope": "MT soja NCM 12011000/12019000", "row_count": len(rows), "sample": rows[:3]}, ensure_ascii=False))
          assert rows, "consulta soja MT ComexStat retornou zero linhas"
          PY
