name: gcp-core-homologation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: agrolog-gcp-core-homologation
  cancel-in-progress: false

jobs:
  homologate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      BUILD_SERVICE_ACCOUNT: ${{ secrets.GCP_BUILD_SERVICE_ACCOUNT }}
      BUILD_SOURCE_BUCKET: ${{ secrets.GCP_BUILD_SOURCE_BUCKET }}
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: southamerica-east1
      BQ_LOCATION: southamerica-east1
      MANAGE_SCHEDULER: "0"
      EVIDENCE_DIR: outputs/n6-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fail closed if bootstrap secrets are missing
        run: |
          missing=0
          for key in WIF_PROVIDER GCP_SERVICE_ACCOUNT BUILD_SERVICE_ACCOUNT BUILD_SOURCE_BUCKET PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "MISSING ${key}"
              missing=1
            else
              echo "READY ${key}"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Execute scripts/setup_github_gcp_wif.sh em Cloud Shell autenticado antes desta homologação." >&2
            exit 2
          fi

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            google-cloud-bigquery google-api-python-client google-auth requests

      - name: Confirm federated identity and project
        run: |
          active="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          echo "Active federated identity: ${active}"
          test "$active" = "$GCP_SERVICE_ACCOUNT"
          gcloud config set project "$PROJECT_ID"
          test "$(gcloud config get-value project)" = "$PROJECT_ID"

      - name: Execute P0/P1 core homologation
        run: bash scripts/homologate_n6_core.sh

      - name: Require explicit PASS and publish job summary
        run: |
          result="$(find "$EVIDENCE_DIR" -name RESULT.txt -type f -print | sort | tail -n 1)"
          test -n "$result"
          grep -Fxq 'N6 CORE HOMOLOGATION: PASS' "$result"
          cat "$result"
          {
            echo '## AgroLog MT — GCP Core Homologation'
            echo
            echo '```text'
            cat "$result"
            echo '```'
            echo
            echo 'Evidência operacional durável permanece em BigQuery/Drive/manifests; GitHub artifact não é requisito de produção.'
          } >> "$GITHUB_STEP_SUMMARY"
