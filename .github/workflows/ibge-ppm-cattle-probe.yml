name: ibge-ppm-cattle-probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "collector/ibge_ppm.py"
      - "scripts/probe_ibge_ppm_cattle.py"
      - "tests/test_ibge_ppm_collector.py"
      - ".github/workflows/ibge-ppm-cattle-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest -v tests.test_ibge_ppm_collector tests.test_product_trade_codes_contract
      - name: Probe live IBGE PPM cattle data for MT municipalities
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/probe_ibge_ppm_cattle.py --period 2024 --min-municipalities 100
