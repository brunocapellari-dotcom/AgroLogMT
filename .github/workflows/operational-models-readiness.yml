name: operational-models-readiness

on:
  pull_request:
    paths:
      - "collector/anp_bioenergy.py"
      - "collector/operational_models_bigquery.py"
      - "models/operational_models.py"
      - "tests/test_anp_bioenergy.py"
      - "tests/test_operational_models.py"
      - "scripts/setup_github_gcp_wif.sh"
      - "scripts/preflight_n6_gcp.sh"
      - "docs/SECURITY.md"
      - ".github/workflows/operational-models-readiness.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight = read-only; homologate = deploy + CONAB/Gateway homologation"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - homologate

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest tests.test_operational_models tests.test_anp_bioenergy -v
      - name: Public ANP probe
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from collector.anp_bioenergy import fetch_ethanol, latest_competence, state_monthly
          payload, rows = fetch_ethanol()
          print('bytes', len(payload), 'rows', len(rows), 'latest', latest_competence(rows))
          mt = state_monthly(rows)
          assert mt and mt[-1]['year'] >= 2026
          print('MT latest', mt[-1])
          PY

  cloud-readiness:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: southamerica-east1
      BQ_LOCATION: southamerica-east1
      MANAGE_SCHEDULER: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate WIF secret readiness without revealing values
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GCP_PROJECT_ID; do
            value="${!key:-}"
            if [ -n "$value" ]; then echo "READY $key"; else echo "MISSING $key"; missing=1; fi
          done
          exit "$missing"
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          version: ">= 390.0.0"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-collector.txt

      - name: Show federated identity
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID" >/dev/null
          gcloud auth list --filter=status:ACTIVE --format='table(account,status)'
          gcloud projects describe "$PROJECT_ID" --format='value(projectId,projectNumber)'

      - name: GCP preflight
        if: inputs.mode == 'preflight'
        run: bash scripts/preflight_n6_gcp.sh

      - name: N6 core homologation
        if: inputs.mode == 'homologate'
        run: |
          set -euo pipefail
          mkdir -p outputs/n6-core
          EVIDENCE_DIR=outputs/n6-core bash scripts/homologate_n6_core.sh

      - name: Upload homologation evidence
        if: always() && inputs.mode == 'homologate'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: n6-core-homologation-${{ github.run_id }}
          path: outputs/n6-core
          if-no-files-found: warn
          retention-days: 30
