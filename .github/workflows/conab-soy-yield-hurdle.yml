name: conab-soy-yield-hurdle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/build_conab_soy_yield_hurdle.py"
      - "tests/test_conab_soy_yield_hurdle.py"
      - "collector/conab_safra.py"
      - "collector/conab_safra_history.py"
      - "models/first_backtests.py"
      - ".github/workflows/conab-soy-yield-hurdle.yml"

permissions:
  contents: read

jobs:
  hurdle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build live CONAB Soja MT annual yield hurdle
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/build_conab_soy_yield_hurdle.py \
            --start-year 2021 \
            --end-year 2025 \
            --out conab_soy_yield_hurdle.json
      - name: Upload hurdle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conab-soy-yield-hurdle-${{ github.run_id }}
          path: conab_soy_yield_hurdle.json
          if-no-files-found: error
          retention-days: 30
