name: conab-soy-yield-hurdle-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hurdle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build live CONAB Soja MT annual yield hurdle
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/build_conab_soy_yield_hurdle.py --start-year 2021 --end-year 2025 --out conab_soy_yield_hurdle.json
      - name: Upload hurdle artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conab-soy-yield-hurdle-${{ github.run_id }}
          path: conab_soy_yield_hurdle.json
          if-no-files-found: error
          retention-days: 30
