name: pecuaria-live-probes

on:
  pull_request:
    paths:
      - "collector/ibge_ppm.py"
      - "collector/ibge_ppm_bigquery.py"
      - "collector/ibge_ppm_pipeline.py"
      - "collector/ibge_sidra.py"
      - "collector/ibge_slaughter.py"
      - "collector/ibge_slaughter_bigquery.py"
      - "collector/ibge_slaughter_pipeline.py"
      - "collector/mapa_sigsif.py"
      - "collector/mapa_sigsif_bigquery.py"
      - "collector/mapa_sigsif_pipeline.py"
      - "collector/snapshot_bigquery.py"
      - "collector/cloud_runner.py"
      - "collector/registry_scheduler.py"
      - "collector/config/data_source_registry.v1.json"
      - "collector/config/sources.pecuaria.json"
      - "contracts/product_trade_codes.v1.json"
      - "models/pecuaria_trade.py"
      - "gateway/pecuaria_queries.py"
      - "gateway/pecuaria_routes.py"
      - "gateway/production_app.py"
      - "gateway/Dockerfile"
      - "scripts/homologate_n6_core.sh"
      - "scripts/homologate_pecuaria_gcp.sh"
      - "scripts/probe_comex_beef_ncm_history.py"
      - "scripts/probe_ibge_ppm_cattle.py"
      - "scripts/probe_ibge_slaughter_cattle.py"
      - "scripts/probe_mapa_sigsif.py"
      - "tests/test_snapshot_bigquery.py"
      - ".github/workflows/pecuaria-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pecuaria-live-probes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-live-probes:
    name: Livestock public-source live probes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 pinned
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 pinned
        with:
          python-version: "3.12"

      - name: Install minimal live-probe dependency
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'

      - name: Probe IBGE PPM cattle current coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/probe_ibge_ppm_cattle.py --period 2024 --min-municipalities 100

      - name: Probe IBGE PPM cattle full historical coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/probe_ibge_ppm_cattle.py --period all --min-municipalities 100 --min-year 1974 --max-year 2024

      - name: Probe IBGE quarterly cattle slaughter
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/probe_ibge_slaughter_cattle.py --period 202601

      - name: Probe MAPA PGA SIGSIF current snapshot
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/probe_mapa_sigsif.py

      - name: Probe representative official Comex beef classification
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/probe_comex_beef_ncm_history.py --from-year 2025 --to-year 2026 --inter-year-delay 0 --out /tmp/comex-beef-probe.json

      - name: Promotion boundary reminder
        shell: bash
        run: |
          echo 'Diagnostic LIVE probes only.'
          echo 'No GCP deploy, Registry promotion, or production authorization occurs here.'
          echo 'The only release authority is full-project-final-gate.'
