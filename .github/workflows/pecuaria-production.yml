name: pecuaria-production

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "collector/ibge_sidra.py"
      - "collector/ibge_ppm.py"
      - "collector/ibge_ppm_bigquery.py"
      - "collector/ibge_ppm_pipeline.py"
      - "collector/ibge_slaughter.py"
      - "collector/ibge_slaughter_bigquery.py"
      - "collector/ibge_slaughter_pipeline.py"
      - "collector/mapa_sigsif.py"
      - "collector/mapa_sigsif_bigquery.py"
      - "collector/mapa_sigsif_pipeline.py"
      - "collector/snapshot_bigquery.py"
      - "collector/adapters.py"
      - "collector/cloud_runner.py"
      - "collector/config/sources.pecuaria.json"
      - "collector/comexstat_pipeline.py"
      - "ckan_connector/**"
      - "contracts/product_trade_codes.v1.json"
      - "models/pecuaria_trade.py"
      - "gateway/pecuaria_queries.py"
      - "gateway/pecuaria_routes.py"
      - "gateway/production_app.py"
      - "gateway/Dockerfile"
      - "scripts/deploy_collectors_gcloud.sh"
      - "scripts/deploy_gateway_gcloud.sh"
      - "scripts/deploy_pecuaria_views.py"
      - "scripts/homologate_pecuaria_gcp.sh"
      - "scripts/validate_pecuaria_bigquery.py"
      - "scripts/validate_pecuaria_trade_history.py"
      - "scripts/validate_pecuaria_gateway.py"
      - ".github/workflows/pecuaria-production.yml"
  schedule:
    - cron: "17 09 10 * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operação"
        required: true
        default: "run"
        type: choice
        options:
          - run
          - deploy_homologate

permissions:
  contents: read
  id-token: write

concurrency:
  group: pecuaria-production
  cancel-in-progress: false

env:
  REGION: southamerica-east1
  BQ_LOCATION: southamerica-east1
  PECUARIA_DATASET: pecuaria
  TRADE_DATASET: comercio_exterior
  OPS_DATASET: agrolog_ops

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud without JSON key
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Install validation runtime
        run: python -m pip install "google-cloud-bigquery>=3.25,<4"

      - name: Verify livestock bootstrap
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          for dataset in "$PECUARIA_DATASET" "$TRADE_DATASET"; do
            if ! bq show --project_id="$PROJECT_ID" "${PROJECT_ID}:${dataset}" >/dev/null 2>&1; then
              echo "Dataset ${dataset} ausente. Execute scripts/bootstrap_pecuaria_gcp.sh uma vez com identidade administradora." >&2
              exit 3
            fi
          done

      - name: Deploy livestock collector
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy_homologate')
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BUILD_SERVICE_ACCOUNT: ${{ secrets.GCP_BUILD_SERVICE_ACCOUNT }}
          BUILD_SOURCE_BUCKET: ${{ secrets.GCP_BUILD_SOURCE_BUCKET }}
          DEPLOY_SCOPE: pecuaria
        run: bash scripts/deploy_collectors_gcloud.sh

      - name: Homologate full livestock data pipeline
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy_homologate')
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: bash scripts/homologate_pecuaria_gcp.sh

      - name: Deploy and validate historical beef view
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy_homologate')
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          python scripts/deploy_pecuaria_views.py \
            --project "$PROJECT_ID" \
            --trade-dataset "$TRADE_DATASET" \
            --location "$BQ_LOCATION"
          python scripts/validate_pecuaria_trade_history.py \
            --project "$PROJECT_ID" \
            --dataset "$TRADE_DATASET" \
            --location "$BQ_LOCATION"

      - name: Deploy AgroLog Gateway with livestock routes
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy_homologate')
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BUILD_SERVICE_ACCOUNT: ${{ secrets.GCP_BUILD_SERVICE_ACCOUNT }}
          BUILD_SOURCE_BUCKET: ${{ secrets.GCP_BUILD_SOURCE_BUCKET }}
          PECUARIA_DATASET: pecuaria
          TRADE_DATASET: comercio_exterior
        run: bash scripts/deploy_gateway_gcloud.sh

      - name: Validate livestock Gateway end to end
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy_homologate')
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: python scripts/validate_pecuaria_gateway.py --project "$PROJECT_ID" --region "$REGION"

      - name: Run scheduled livestock collection and regression checks
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'run')
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          gcloud run jobs execute agrolog-pecuaria \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --wait
          python scripts/validate_pecuaria_bigquery.py \
            --project "$PROJECT_ID" \
            --dataset "$PECUARIA_DATASET" \
            --ops-dataset "$OPS_DATASET" \
            --location "$BQ_LOCATION" \
            --scope all
          python scripts/validate_pecuaria_trade_history.py \
            --project "$PROJECT_ID" \
            --dataset "$TRADE_DATASET" \
            --location "$BQ_LOCATION"
          python scripts/validate_pecuaria_gateway.py \
            --project "$PROJECT_ID" \
            --region "$REGION"
