name: maritime-final-acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maritime-final-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-project:
    name: full-project
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install complete Python test and runtime surface
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements-collector.txt \
            -r requirements-gateway.txt \
            "PyYAML>=6,<7" \
            "bandit>=1.8,<2" \
            "pip-audit>=2.9,<3"

      - name: Run all-or-nothing project acceptance
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/maritime_final_acceptance.py --static-only

      - name: Publish acceptance report
        if: always()
        run: |
          if [ -f outputs/maritime/final-acceptance.json ]; then
            {
              echo '## AgroLog Maritime — Full Project Acceptance'
              echo
              echo '```json'
              cat outputs/maritime/final-acceptance.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
