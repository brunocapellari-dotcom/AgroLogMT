name: ibge-pam-soy-yield-hurdle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/build_ibge_pam_soy_yield_hurdle.py"
      - "tests/test_ibge_pam_soy_yield_hurdle.py"
      - ".github/workflows/ibge-pam-soy-yield-hurdle.yml"
      - "models/backtest.py"

permissions:
  contents: read

jobs:
  hurdle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest -v tests.test_ibge_pam_soy_yield_hurdle
      - name: Build live IBGE PAM Soja MT yield hurdle
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/build_ibge_pam_soy_yield_hurdle.py \
            --label-lag-years 2 \
            --min-train 5 \
            --out ibge_pam_soy_yield_hurdle.json
      - name: Upload hurdle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibge-pam-soy-yield-hurdle-${{ github.run_id }}
          path: ibge_pam_soy_yield_hurdle.json
          if-no-files-found: error
          retention-days: 30
