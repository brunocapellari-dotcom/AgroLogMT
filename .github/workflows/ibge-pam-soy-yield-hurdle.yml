name: ibge-pam-soy-yield-hurdle-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hurdle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run focused unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest -v tests.test_ibge_pam_soy_yield_hurdle
      - name: Build live IBGE PAM Soja MT yield hurdle
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/build_ibge_pam_soy_yield_hurdle.py --label-lag-years 2 --min-train 5 --out ibge_pam_soy_yield_hurdle.json
      - name: Upload hurdle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ibge-pam-soy-yield-hurdle-${{ github.run_id }}
          path: ibge_pam_soy_yield_hurdle.json
          if-no-files-found: error
          retention-days: 30
