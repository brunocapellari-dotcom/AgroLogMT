name: comex-beef-ncm-history-probe

on:
  workflow_dispatch:
  schedule:
    - cron: "43 10 15 * *"

permissions:
  contents: read

concurrency:
  group: comex-beef-ncm-history-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install "requests>=2.31,<3"
      - name: Probe annual historical NCM codes used by Comex Stat
        id: probe
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/probe_comex_beef_ncm_history.py \
            --from-year 1997 \
            --to-year "$(date -u +%Y)" \
            --inter-year-delay 15 \
            --out comex_beef_ncm_history_probe.json
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comex-beef-ncm-history-${{ github.run_id }}
          path: comex_beef_ncm_history_probe.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce audit success
        if: steps.probe.outcome != 'success'
        run: exit 1
