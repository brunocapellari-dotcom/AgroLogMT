name: Diagnose MDF-e Power BI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Diagnose public ANTT Power BI
        run: python scripts/diagnose_mdfe_powerbi.py
      - name: Extract golden sample
        run: python scripts/extract_mdfe_powerbi.py
      - name: Inspect filter breakdowns
        run: python scripts/test_mdfe_filters.py
      - name: Validate exact NCM
        run: python scripts/test_mdfe_ncm_exact.py
      - name: Export workbook flows
        run: python scripts/export_mdfe_destinations.py
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mdfe-powerbi-diagnostic
          path: |
            mdfe_powerbi_diagnostic/
            mdfe_powerbi_extract/
            mdfe_powerbi_export/
          if-no-files-found: warn
          retention-days: 3
