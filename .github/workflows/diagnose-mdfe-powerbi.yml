name: Diagnose MDF-e Power BI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/diagnose_mdfe_powerbi.py'
      - 'scripts/extract_mdfe_powerbi.py'
      - 'scripts/test_mdfe_filters.py'
      - 'scripts/test_mdfe_ncm_exact.py'
      - 'scripts/export_mdfe_destinations.py'
      - '.github/workflows/diagnose-mdfe-powerbi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Download BDMEP ZIP
        run: |
          mkdir -p bdmep_download
          python - <<'PY'
          import requests
          url = 'https://bdmep.inmet.gov.br/$2a$10$Il5Utr1Kvotkvb.mOqpuKO.oXEU6jrxcUcOJRvMmiouACVJgVxSm.zip'
          r = requests.get(url, timeout=120)
          r.raise_for_status()
          open('bdmep_download/BDMEP_INMET_2026-08-25.zip','wb').write(r.content)
          print(len(r.content))
          PY
      - name: Diagnose public ANTT Power BI
        run: python scripts/diagnose_mdfe_powerbi.py
      - name: Extract golden sample
        run: python scripts/extract_mdfe_powerbi.py
      - name: Inspect filter breakdowns
        run: python scripts/test_mdfe_filters.py
      - name: Validate exact NCM
        run: python scripts/test_mdfe_ncm_exact.py
      - name: Export workbook flows
        run: python scripts/export_mdfe_destinations.py
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdfe-powerbi-diagnostic
          path: |
            mdfe_powerbi_diagnostic/
            mdfe_powerbi_extract/
            mdfe_powerbi_export/
            bdmep_download/
          if-no-files-found: warn
          retention-days: 3
