name: Diagnose MDF-e Power BI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/diagnose-mdfe-powerbi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download second BDMEP ZIP
        run: |
          mkdir -p bdmep_download
          curl -4 --http1.1 -fL \
            --retry 12 --retry-all-errors --retry-delay 3 \
            --connect-timeout 30 --max-time 600 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -e 'https://bdmep.inmet.gov.br/' \
            'https://bdmep.inmet.gov.br/$2a$10$LJanUGGYAoX8zFNnY1WHOjjRP8ghoJulUeOjIFu4Caq1520xZSK.zip' \
            -o bdmep_download/BDMEP_INMET_2026-08-25_segundo.zip
          unzip -t bdmep_download/BDMEP_INMET_2026-08-25_segundo.zip
      - name: Upload BDMEP artifact
        uses: actions/upload-artifact@v4
        with:
          name: bdmep-second-download
          path: bdmep_download/BDMEP_INMET_2026-08-25_segundo.zip
          if-no-files-found: error
          retention-days: 1
