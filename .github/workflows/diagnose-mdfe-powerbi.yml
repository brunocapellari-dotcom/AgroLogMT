name: Diagnose MDF-e Power BI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mdfe-powerbi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download second BDMEP ZIP
        run: |
          mkdir -p bdmep_download
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 \
            'https://bdmep.inmet.gov.br/$2a$10$LJanUGGYAoX8zFNnY1WHOjjRP8ghoJulUeOjIFu4Caq1520xZSK.zip' \
            -o bdmep_download/BDMEP_INMET_2026-08-25_segundo.zip
          unzip -t bdmep_download/BDMEP_INMET_2026-08-25_segundo.zip
      - name: Upload BDMEP artifact
        uses: actions/upload-artifact@v4
        with:
          name: bdmep-second-download
          path: bdmep_download/BDMEP_INMET_2026-08-25_segundo.zip
          if-no-files-found: error
          retention-days: 1
