name: ais-live-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: southamerica-east1
      BQ_LOCATION: southamerica-east1
      DATASET: agrolog_models
      AIS_JOB_NAME: agrolog-ais
    steps:
      - name: Fail closed if GCP bootstrap is incomplete
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in WIF_PROVIDER GCP_SERVICE_ACCOUNT PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "MISSING ${key}"
              missing=1
            else
              echo "READY ${key}"
            fi
          done
          test "$missing" -eq 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3 pinned
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3 pinned
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Confirm federated identity and existing AIS job
        shell: bash
        run: |
          set -euo pipefail
          active="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          test "$active" = "$GCP_SERVICE_ACCOUNT"
          gcloud run jobs describe "$AIS_JOB_NAME" --region "$REGION" --project "$PROJECT_ID" >/dev/null

      - name: Execute bounded AIS runtime probe
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs execute "$AIS_JOB_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --wait \
            --update-env-vars AIS_MAX_RECORDS=1,AIS_CAPTURE_SECONDS=90

      - name: Validate fresh observation without exposing AIS credential
        shell: bash
        run: |
          set -euo pipefail
          rows="$(bq query --project_id="$PROJECT_ID" --location="$BQ_LOCATION" --use_legacy_sql=false --format=csv --quiet \
            "SELECT COUNT(*) AS n FROM \`${PROJECT_ID}.${DATASET}.shipping_ais_positions\` WHERE observed_at >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 15 MINUTE)" | tail -n1)"
          echo "Fresh AIS observations: ${rows}"
          test "${rows:-0}" -gt 0
