name: maritime-ais-control

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to trigger after GCP/WIF homologation"
        required: true
        default: ais
        type: choice
        options:
          - ais
          - reconcile

permissions:
  contents: read

concurrency:
  group: maritime-ais-control
  cancel-in-progress: false

jobs:
  trigger:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: southamerica-east1
      AIS_JOB_NAME: agrolog-ais
      RECON_JOB_NAME: agrolog-shipping-reconcile
      REQUESTED_ACTION: ${{ inputs.action }}
    steps:
      - name: Fail closed if GCP bootstrap is incomplete
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in WIF_PROVIDER GCP_SERVICE_ACCOUNT PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "MISSING ${key}"
              missing=1
            fi
          done
          test "$missing" -eq 0
          case "$REQUESTED_ACTION" in ais|reconcile) ;; *) echo "Invalid action" >&2; exit 2 ;; esac

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3 pinned
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3 pinned

      - name: Trigger near-continuous AIS capture
        if: env.REQUESTED_ACTION == 'ais'
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs describe "$AIS_JOB_NAME" --region "$REGION" --project "$PROJECT_ID" >/dev/null
          gcloud run jobs executions list \
            --job "$AIS_JOB_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --sort-by='~metadata.creationTimestamp' \
            --limit=1 \
            --format=json > /tmp/latest-ais-execution.json
          if python3 - <<'PY'
          import json, sys
          rows = json.load(open('/tmp/latest-ais-execution.json', encoding='utf-8'))
          active = bool(rows and rows[0].get('status', {}).get('startTime') and not rows[0].get('status', {}).get('completionTime'))
          sys.exit(10 if active else 0)
          PY
          then
            gcloud run jobs execute "$AIS_JOB_NAME" --region "$REGION" --project "$PROJECT_ID" --async
            echo 'AIS execution triggered.'
          else
            code=$?
            if [ "$code" -eq 10 ]; then
              echo 'AIS execution already active; duplicate trigger skipped.'
            else
              exit "$code"
            fi
          fi

      - name: Trigger reconciliation
        if: env.REQUESTED_ACTION == 'reconcile'
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs describe "$RECON_JOB_NAME" --region "$REGION" --project "$PROJECT_ID" >/dev/null
          gcloud run jobs execute "$RECON_JOB_NAME" --region "$REGION" --project "$PROJECT_ID" --async
          echo 'Reconciliation execution triggered.'

      - name: Scheduling ownership
        run: echo 'Recurring production scheduling belongs to GCP Cloud Scheduler after final homologation, not GitHub Actions.'
