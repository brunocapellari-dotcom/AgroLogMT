name: conab-soy-revision-calibration-diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run focused unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest -v tests.test_conab_soy_revision_calibration
      - name: Build live CONAB revision calibration
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/analyze_conab_soy_revision_calibration.py --out conab_soy_revision_calibration.json
      - name: Upload calibration artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conab-soy-revision-calibration-${{ github.run_id }}
          path: conab_soy_revision_calibration.json
          if-no-files-found: error
          retention-days: 30
