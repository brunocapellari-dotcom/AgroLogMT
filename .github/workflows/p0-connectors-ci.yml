name: P0 Connectors Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 pinned
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Unit tests
        run: python -m unittest tests.test_p0_adapters -v
      - name: Security policy tests
        run: python -m unittest tests.test_security_policy -v
      - name: Live BCB PTAX primary probe
        run: |
          python - <<'PY'
          import hashlib, json
          from collector.models import SourceSpec
          from collector.p0_adapters import BcbPtaxDailyAdapter

          spec = SourceSpec(
              source_id='bcb_ptax_usd_daily',
              name='PTAX',
              group='dados',
              method='bcb_ptax_daily',
              file_extension='csv',
              options={'days_back': 7, 'timeout_seconds': 30},
          )
          result = BcbPtaxDailyAdapter().fetch(spec)
          if not result.raw_payload:
              raise RuntimeError('PTAX_NATIVE_RAW_MISSING')
          body = json.loads(result.payload)
          row = body['latest']
          safe = {
              'source': body['source'],
              'dataHoraCotacao': row['dataHoraCotacao'],
              'cotacaoCompra': row['cotacaoCompra'],
              'cotacaoVenda': row['cotacaoVenda'],
              'observed_url': result.observed_url,
              'raw_crosscheck': body['raw_crosscheck'],
              'raw_bytes': len(result.raw_payload),
              'raw_sha256': hashlib.sha256(result.raw_payload).hexdigest(),
          }
          print(json.dumps(safe, ensure_ascii=False, sort_keys=True))
          open('ptax_primary_probe.json', 'w', encoding='utf-8').write(
              json.dumps(safe, ensure_ascii=False, sort_keys=True, indent=2)
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        if: always()
        continue-on-error: true
        with:
          name: p0-primary-probes
          path: ptax_primary_probe.json
          if-no-files-found: ignore
          retention-days: 3
