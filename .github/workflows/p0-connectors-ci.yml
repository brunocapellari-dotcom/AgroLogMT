name: P0 Connectors CI

on:
  push:
    branches: [main]
    paths:
      - 'collector/p0_adapters.py'
      - 'collector/p0_pipeline.py'
      - 'collector/cloud_runner.py'
      - 'collector/config/sources.p0.json'
      - 'scripts/backfill_m04_ana.py'
      - 'scripts/build_m04_hydro_views.py'
      - 'scripts/deploy_p0_connectors_gcloud.sh'
      - 'scripts/validate_p0_connectors_gcloud.sh'
      - 'tests/test_p0_adapters.py'
      - 'tests/test_security_policy.py'
      - 'docs/SECURITY.md'
      - '.github/workflows/p0-connectors-ci.yml'
  pull_request:
    paths:
      - 'collector/p0_adapters.py'
      - 'collector/p0_pipeline.py'
      - 'collector/cloud_runner.py'
      - 'collector/config/sources.p0.json'
      - 'scripts/backfill_m04_ana.py'
      - 'scripts/build_m04_hydro_views.py'
      - 'scripts/deploy_p0_connectors_gcloud.sh'
      - 'scripts/validate_p0_connectors_gcloud.sh'
      - 'tests/test_p0_adapters.py'
      - 'tests/test_security_policy.py'
      - 'docs/SECURITY.md'
      - '.github/workflows/p0-connectors-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install minimal dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Unit tests
        run: python -m unittest tests.test_p0_adapters -v
      - name: Security policy tests
        run: python -m unittest tests.test_security_policy -v
      - name: Live BCB PTAX primary probe
        run: |
          python - <<'PY'
          import hashlib,json
          from collector.models import SourceSpec
          from collector.p0_adapters import BcbPtaxDailyAdapter
          spec=SourceSpec(source_id='bcb_ptax_usd_daily',name='PTAX',group='dados',method='bcb_ptax_daily',file_extension='csv',options={'days_back':7,'timeout_seconds':30})
          result=BcbPtaxDailyAdapter().fetch(spec)
          if not result.raw_payload:
              raise RuntimeError('PTAX_NATIVE_RAW_MISSING')
          body=json.loads(result.payload)
          row=body['latest']
          safe={
              'source':body['source'],
              'dataHoraCotacao':row['dataHoraCotacao'],
              'cotacaoCompra':row['cotacaoCompra'],
              'cotacaoVenda':row['cotacaoVenda'],
              'observed_url':result.observed_url,
              'raw_crosscheck':body['raw_crosscheck'],
              'raw_bytes':len(result.raw_payload),
              'raw_sha256':hashlib.sha256(result.raw_payload).hexdigest(),
          }
          print(json.dumps(safe,ensure_ascii=False,sort_keys=True))
          open('ptax_primary_probe.json','w',encoding='utf-8').write(json.dumps(safe,ensure_ascii=False,sort_keys=True,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          name: p0-primary-probes
          path: ptax_primary_probe.json
          if-no-files-found: ignore
          retention-days: 7
