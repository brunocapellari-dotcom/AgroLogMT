name: Mercado Financeiro FRE 2011-2022

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/mercado_financeiro_bridge/download_fre_2011_2022.py'
      - '.github/workflows/mercado-financeiro-fre-2011-2022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fre:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download FRE 2011-2022
        run: python tools/mercado_financeiro_bridge/download_fre_2011_2022.py
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with: {name: mf-fre-2011-2022-manifest, path: mf_fre_2011_2022/manifest.json, retention-days: 1}
      - name: Upload yearly FRE
        uses: actions/upload-artifact@v4
        with:
          name: mf-fre-2011-2022
          path: |
            mf_fre_2011_2022/2011/
            mf_fre_2011_2022/2012/
            mf_fre_2011_2022/2013/
            mf_fre_2011_2022/2014/
            mf_fre_2011_2022/2015/
            mf_fre_2011_2022/2016/
            mf_fre_2011_2022/2017/
            mf_fre_2011_2022/2018/
            mf_fre_2011_2022/2019/
            mf_fre_2011_2022/2020/
            mf_fre_2011_2022/2021/
            mf_fre_2011_2022/2022/
          retention-days: 1
