name: diagnose-comex-tls

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "collector/comexstat_api.py"
      - "collector/adapters.py"
      - "scripts/probe_comex_api_live.py"
      - "scripts/diagnose_comex_tls_transition.py"
      - ".github/workflows/diagnose-comex-tls.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "requests>=2.32,<3"

      - name: Probe operational ComexStat API first
        id: api
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/probe_comex_api_live.py | tee comex_api_report.json

      - name: Probe raw CSV only as backfill fallback
        id: csv
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/diagnose_comex_tls_transition.py | tee comex_csv_fallback_report.json

      - name: Summarize route status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              p = Path(path)
              if not p.exists():
                  return None
              try:
                  return json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  return None

          api = load('comex_api_report.json') or {}
          csv = load('comex_csv_fallback_report.json') or {}
          summary = {
              'operational_primary': 'api',
              'api_status': api.get('status', 'NO_REPORT'),
              'api_probe_outcome': '${{ steps.api.outcome }}',
              'csv_role': 'backfill_reconciliation_fallback',
              'csv_probe_outcome': '${{ steps.csv.outcome }}',
              'csv_any_verified_path': bool(
                  ((csv.get('current') or {}).get('requests') or {}).get('ok')
                  or ((csv.get('transitional') or {}).get('requests') or {}).get('ok')
              ),
              'policy': 'API failure does not authorize verify=false; CSV failure does not downgrade the API architecture.'
          }
          Path('comex_route_summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comex-api-and-fallback-report
          path: |
            comex_api_report.json
            comex_csv_fallback_report.json
            comex_route_summary.json
          if-no-files-found: warn
          retention-days: 14
