name: diagnose-comex-tls

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/diagnose_comex_tls_transition.py"
      - ".github/workflows/diagnose-comex-tls.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "requests>=2.32,<3"
      - name: Compare verified TLS endpoints
        run: python scripts/diagnose_comex_tls_transition.py | tee comex_tls_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comex-tls-report
          path: comex_tls_report.json
          if-no-files-found: error
          retention-days: 14
