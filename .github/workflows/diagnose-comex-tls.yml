name: diagnose-comex-tls

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/diagnose_comex_tls_transition.py"
      - ".github/workflows/diagnose-comex-tls.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "requests>=2.32,<3"
      - name: Probe raw CSV only as backfill fallback
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/diagnose_comex_tls_transition.py | tee comex_csv_fallback_report.json
      - name: State architecture policy
        if: always()
        run: |
          echo "ComexStat API remains the operational primary path."
          echo "Raw CSV is backfill/reconciliation only and its TLS state does not downgrade the API architecture."
          echo "No verify=false or curl -k is permitted."
