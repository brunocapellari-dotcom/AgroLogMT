name: Mercado Financeiro Backfill 2011-2022

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/mercado_financeiro_bridge/download_backfill_2011_2022.py'
      - '.github/workflows/mercado-financeiro-backfill-2011-2022.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official B3/CVM 2011-2022
        run: python tools/mercado_financeiro_bridge/download_backfill_2011_2022.py
      - name: Upload global manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mf-backfill-2011-2022-manifest
          path: mf_backfill_2011_2022/manifest.json
          retention-days: 1
      - name: Upload 2011
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: mf-backfill-2011, path: mf_backfill_2011_2022/2011/, retention-days: 1}
      - name: Upload 2012
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: mf-backfill-2012, path: mf_backfill_2011_2022/2012/, retention-days: 1}
      - name: Upload 2013
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: mf-backfill-2013, path: mf_backfill_2011_2022/2013/, retention-days: 1}
      - name: Upload 2014
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: mf-backfill-2014, path: mf_backfill_2011_2022/2014/, retention-days: 1}
      - name: Upload 2015
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: mf-backfill-2015, path: mf_backfill_2011_2022/2015/, retention-days: 1}
      - name: Upload 2016
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: mf-backfill-2016, path: mf_backfill_2011_2022/2016/, retention-days: 1}
      - name: Upload 2017
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: mf-backfill-2017, path: mf_backfill_2011_2022/2017/, retention-days: 1}
      - name: Upload 2018
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: mf-backfill-2018, path: mf_backfill_2011_2022/2018/, retention-days: 1}
      - name: Upload 2019
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: mf-backfill-2019, path: mf_backfill_2011_2022/2019/, retention-days: 1}
      - name: Upload 2020
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: mf-backfill-2020, path: mf_backfill_2011_2022/2020/, retention-days: 1}
      - name: Upload 2021
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: mf-backfill-2021, path: mf_backfill_2011_2022/2021/, retention-days: 1}
      - name: Upload 2022
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: mf-backfill-2022, path: mf_backfill_2011_2022/2022/, retention-days: 1}
